<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#02010a">
  <meta name="description" content="Una galaxia interactiva de amor para dedicar a tu pareja.">
  <title>Una galaxia para nuestro amor ♥</title>

  <!-- Tipografias (si no hay internet se usan Georgia / Arial automaticamente) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <!-- Aqui se dibuja la galaxia (WebGL) -->
  <canvas id="lienzo"></canvas>

  <!-- Frases, fotos y stickers colocados en 3D (HTML) -->
  <div id="vista3d"><div id="vista3d-vista"><div id="vista3d-camara"></div></div></div>

  <!-- PANTALLA DE ENTRADA (los textos se cambian en js/config.js) -->
  <div id="intro">
    <div class="intro-tarjeta">
      <h1 id="intro-titulo"></h1>
      <img id="intro-sticker" class="intro-sticker" alt="" draggable="false">
      <p id="intro-subtitulo"></p>
      <button id="btn-entrar" type="button"><span id="btn-texto"></span><i class="burbuja" aria-hidden="true">&hearts;</i></button>
    </div>
  </div>

  <!-- Mensaje que se escribe solo al empezar -->
  <div id="mensaje-inicial" aria-live="polite"></div>

  <!-- Botones de abajo a la derecha -->
  <div id="botones" class="oculto">
    <button id="btn-musica" type="button" class="apagado" aria-label="Reproducir musica" title="Reproducir musica" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <path fill="currentColor" d="M9 18V6l11-2v12.2a3 3 0 1 1-2-2.8V7.3L11 8.5V18a3 3 0 1 1-2-2.8z"/>
        <line class="rayita" x1="3" y1="3" x2="21" y2="21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
    </button>
    <button id="btn-pantalla" type="button" aria-label="Pantalla completa" title="Pantalla completa">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M4 4h6v2H6v4H4V4zm10 0h6v6h-2V6h-4V4zM4 14h2v4h4v2H4v-6zm14 0h2v6h-6v-2h4v-4z"/></svg>
    </button>
  </div>

  <!-- Tarjeta: foto (o video) + titulo + mensaje + boton VOLVER -->
  <div id="visor" class="oculto" role="dialog" aria-modal="true">
    <div id="tarjeta">
      <div id="visor-medio"></div>
      <h2 id="visor-titulo"></h2>
      <p id="visor-leyenda"></p>
      <button id="visor-cerrar" type="button">VOLVER <span aria-hidden="true">&hearts;</span></button>
      <i class="burbuja-tarjeta" aria-hidden="true">&hearts;</i>
    </div>
  </div>

  <!-- Corazoncitos que salen al tocar -->
  <div id="capa-corazones" aria-hidden="true"></div>

  <!-- Codigo (el orden importa, no lo cambies) -->
  <script src="libs/three.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utilidades.js"></script>
  <script src="js/fondo.js"></script>
  <script src="js/galaxia.js"></script>
  <script src="js/corazon.js"></script>
  <script src="js/corazones.js"></script>
  <script src="js/capa3d.js"></script>
  <script src="js/flotantes.js"></script>
  <script src="js/camara.js"></script>
  <script src="js/musica.js"></script>
  <script src="js/interfaz.js"></script>
  <script src="js/principal.js"></script>
</body>
</html>
